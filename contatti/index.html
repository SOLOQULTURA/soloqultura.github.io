<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contatti — SOLOQULTURA</title>

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Contatta SOLOQULTURA." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --white:#fff;
      --line:rgba(255,255,255,0.18);
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 25%, rgba(255,255,255,0.03), transparent 65%),
        radial-gradient(1400px 1000px at 50% 90%, rgba(0,0,0,0.85), #000 70%);
    }

    .back{
      position:fixed;
      left:18px;
      top:18px;
      color:#fff;
      text-decoration:none;
      letter-spacing:0.22em;
      text-transform:uppercase;
      font-size:12px;
      opacity:0.9;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,0.25);
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      transition:opacity .2s ease, transform .2s ease, border-color .2s ease;
    }

    .back:hover{
      opacity:1;
      transform:translateY(-2px);
      border-color:#fff;
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:80px 20px;
      text-align:center;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      gap:22px;
      align-items:center;
    }

    h1{
      margin:0;
      font-size:14px;
      letter-spacing:0.30em;
      text-transform:uppercase;
      font-weight:400;
    }

    .divider{
      width:140px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:16px;
      margin-top:8px;
    }

    .links a{
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.22em;
      font-size:12px;
      padding:12px 16px;
      border:1px solid rgba(255,255,255,0.25);
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      transition:transform .2s ease, border-color .2s ease, opacity .2s ease;
      opacity:0.95;
    }

    .links a:hover{
      transform:translateY(-2px);
      border-color:#fff;
      opacity:1;
    }

  </style>
</head>

<body>

  <!-- HOME CORRETTO -->
  <a class="back" href="/">← Home</a>

  <main class="container">
    <section class="wrap">

      <h1>CONTATTI</h1>
      <div class="divider"></div>

      <div class="links">
        <a href="https://instagram.com/solo.qultura" target="_blank">
          Instagram
        </a>

        <a href="mailto:soloqulturalab@gmail.com">
          Email
        </a>
      </div>

    </section>
  </main>

</body>
</html>
