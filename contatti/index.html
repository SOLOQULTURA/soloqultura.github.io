<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contatti — SOLOQULTURA</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Contatta SOLOQULTURA." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --white:#fff;
      --line:rgba(255,255,255,0.18);
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 25%, rgba(255,255,255,0.03), transparent 65%),
        radial-gradient(1400px 1000px at 50% 90%, rgba(0,0,0,0.85), #000 70%);
    }

    .back{
      position:absolute;
      left:20px;
      top:22px;
      color:#fff;
      text-decoration:none;
      letter-spacing:0.22em;
      text-transform:uppercase;
      font-size:12px;
      opacity:0.85;
      padding:8px 10px;
      border:1px solid rgba(255,255,255,0.18);
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      transition:opacity .18s ease, transform .18s ease, border-color .18s ease;
    }

    .back:hover{
      opacity:1;
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.28);
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:46px 20px;
      text-align:center;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      gap:22px;
      align-items:center;
      opacity:0;
      transform:translateY(10px);
      animation: fadeIn 1.1s cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes fadeIn{
      to{opacity:1; transform:translateY(0);}
    }

    h1{
      margin:0;
      font-size:13px;
      letter-spacing:0.30em;
      text-transform:uppercase;
      font-weight:400;
    }

    .divider{
      width:140px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--line), transparent);
      margin:4px 0 6px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:2px;
    }

    .links a{
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.22em;
      font-size:12px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,0.18);
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      opacity:0.92;
      transition:opacity .18s ease, transform .18s ease, border-color .18s ease, background .18s ease;
      min-width:260px;
    }

    .links a:hover{
      opacity:1;
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.28);
      background:rgba(255,255,255,0.06);
    }

    .small{
      margin-top:10px;
      font-size:12px;
      letter-spacing:0.16em;
      color:rgba(255,255,255,0.65);
      text-transform:uppercase;
      line-height:1.7;
      max-width:560px;
    }

    @media (prefers-reduced-motion: reduce){
      .wrap{animation:none; opacity:1; transform:none;}
      .back, .links a{transition:none;}
    }
  </style>
</head>

<body>
  <a class="back" href="index.html">← Home</a>

  <main class="container">
    <section class="wrap">
      <h1>CONTATTI</h1>
      <div class="divider"></div>

      <div class="links">
        <a href="https://instagram.com/solo.qultura" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="mailto:soloqulturalab@gmail.com?subject=Contatto%20SOLOQULTURA">Email</a>
      </div>

      <div class="small">
        Collaborazioni, produzioni, progetti culturali.<br>
        Scrivici con due righe e un riferimento.
      </div>
    </section>
  </main>
</body>
</html>
