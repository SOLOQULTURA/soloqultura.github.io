<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti — SOLOQULTURA</title>

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <meta name="description" content="Contatti SOLOQULTURA — Instagram ed email ufficiale.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --white:#ffffff;
      --line:rgba(255,255,255,0.25);
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      background:#000;
      color:#fff;
      font-family:Inter, system-ui, -apple-system, sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,0.04), transparent 65%),
        radial-gradient(1400px 1000px at 50% 85%, rgba(0,0,0,0.85), #000 70%);
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:30px;
      max-width:600px;
      animation:fade 1.2s ease forwards;
      opacity:0;
      transform:translateY(10px);
    }

    @keyframes fade{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:14px;
      letter-spacing:0.35em;
      text-transform:uppercase;
      font-weight:400;
      color:#ffffff; /* BIANCO PIENO */
      margin:0;
    }

    .divider{
      width:120px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .btn{
      display:inline-block;
      padding:12px 26px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.35);
      text-decoration:none;
      color:#ffffff;
      font-size:12px;
      letter-spacing:0.25em;
      text-transform:uppercase;
      transition:all .25s ease;
      background:rgba(255,255,255,0.04);
    }

    .btn:hover{
      transform:translateY(-2px);
      border-color:#ffffff;
      background:rgba(255,255,255,0.08);
    }

    .home-link{
      margin-top:30px;
      font-size:11px;
      letter-spacing:0.25em;
      text-transform:uppercase;
      color:#ffffff;
      text-decoration:none;
      opacity:0.8;
      transition:opacity .2s ease;
    }

    .home-link:hover{
      opacity:1;
    }

  </style>
</head>

<body>

  <main class="container">
    <div class="wrap">

      <h1>CONTATTI</h1>

      <div class="divider"></div>

      <a href="https://instagram.com/solo.qultura" target="_blank" class="btn">
        Instagram
      </a>

      <a href="mailto:soloqulturalab@gmail.com" class="btn">
        Email
      </a>

      <a href="/" class="home-link">
        HOME
      </a>

    </div>
  </main>

</body>
</html>
