<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root{
      --bg:#000;
      --white:#fff;
      --line:rgba(255,255,255,0.25);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,0.04), transparent 65%),
        radial-gradient(1400px 1000px at 50% 85%, rgba(0,0,0,0.90), #000 72%);
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:56px 20px;
      text-align:center;
    }

    .wrap{
      width:min(760px, 100%);
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp 1.1s cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

    /* ✅ TITOLO BIANCO (sempre visibile) */
    h1{
      margin:0;
      font-size: clamp(16px, 2vw, 18px);
      letter-spacing:0.35em;
      text-transform:uppercase;
      font-weight:500;
      color:#fff;
      opacity:0.98;
    }

    .cta{
      margin-top:26px;
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
    }

    .btn{
      width:min(320px, 100%);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.35);
      background:rgba(255,255,255,0.05);
      color:#fff;
      text-decoration:none;
      font-size:12px;
      letter-spacing:0.28em;
      text-transform:uppercase;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .btn:hover{
      transform: translateY(-2px);
      background:rgba(255,255,255,0.08);
      border-color:#fff;
    }

    .email{
      margin-top:18px;
      font-size:13px;
      opacity:0.92;
    }

    .email a{
      color:#fff;
      text-decoration:underline;
    }

    .back{
      margin-top:18px;
      display:inline-block;
      font-size:11px;
      letter-spacing:0.24em;
      text-transform:uppercase;
      opacity:0.8;
      color:#fff;
      text-decoration:none;
    }
    .back:hover{ opacity:1; }
  </style>

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"ContactPage",
    "name":"Contatti — SOLOQULTURA",
    "url":"https://www.soloqultura.com/contatti/",
    "mainEntity":{
      "@type":"Organization",
      "name":"SOLOQULTURA",
      "email":"soloqulturalab@gmail.com",
      "url":"https://www.soloqultura.com/"
    }
  }
  </script>
</head>

<body>
  <main class="container">
    <section class="wrap">
      <h1>CONTATTI</h1>

      <div class="cta">
        <a class="btn" href="https://instagram.com/solo.qultura" target="_blank" rel="noopener">INSTAGRAM</a>
        <a class="btn" href="mailto:soloqulturalab@gmail.com">EMAIL</a>
      </div>

      <div class="email">
        <a href="mailto:soloqulturalab@gmail.com">soloqulturalab@gmail.com</a>
      </div>

      <a class="back" href="/">HOME</a>
    </section>
  </main>
</body>
</html>
