<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOQULTURA</title>

  <!-- Icone Social -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
  html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

.container {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.main-logo {
  width: clamp(320px, 42vw, 720px);
  height: auto;
  margin-bottom: 8px;
  filter: brightness(1.18) contrast(1.05) drop-shadow(0 0 28px rgba(255,255,255,0.18));
  transition: 0.4s ease;
}

.main-logo:hover {
  filter: brightness(1.28) contrast(1.08) drop-shadow(0 0 42px rgba(255,255,255,0.28));
}

.tagline {
  margin-top: 8px;
  font-size: 15px;
  letter-spacing: 0.45em;
  color: rgba(255,255,255,0.75);
}

.divider {
  margin: 25px 0;
  width: 120px;
  height: 1px;
  background: rgba(255,255,255,0.3);
}

.social {
  display: flex;
  gap: 22px;
}

.social a {
  color: white;
  font-size: 20px;
  transition: 0.3s ease;
}

.social a:hover {
  opacity: 0.6;
}

.email {
  margin-top: 22px;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}

.email a {
  color: rgba(255,255,255,0.8);
  text-decoration: none;
}

.email a:hover {
  text-decoration: underline;
}

  </style>
</head>

<body>

  <div class="container">
   <img src="images/logo.png" alt="SOLOQULTURA" class="main-logo">

    <div class="tagline">
      SUONO. FUTURO. QLTURA.
    </div>

    <div class="divider"></div>

    <div class="social">
      <!-- Sostituisci i link -->
      <a href="https://instagram.com/solo.qultura" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com/@soloqultura" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://open.spotify.com/intl-it/artist/0lZbzkTC3h5CpS736vUP4f" target="_blank"><i class="fab fa-spotify"></i></a>

    </div>

    <div class="email">
      <a href="mailto:soloqulturalab@gmail.com">soloqulturalab@gmail.com</a>
    </div>

  </div>

</body>
</html>
