<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLOQULTURA</title>

  <!-- Icone Social -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 8vw, 90px);
      letter-spacing: 0.25em;
      margin: 0;
      font-weight: 800;
    }

    .tagline {
      margin-top: 20px;
      font-size: 16px;
      letter-spacing: 0.4em;
      color: rgba(255,255,255,0.7);
    }

    .divider {
      margin: 30px 0;
      width: 120px;
      height: 1px;
      background: rgba(255,255,255,0.3);
    }

    .social {
      display: flex;
      gap: 20px;
    }

    .social a {
      color: white;
      font-size: 20px;
      transition: 0.3s;
    }

    .social a:hover {
      opacity: 0.6;
    }

    .email {
      margin-top: 25px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }

    .email a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
    }

    .email a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
   <img src="images/logo.png" alt="SOLOQULTURA" style="max-width:420px;width:75vw;height:auto;margin-bottom:20px;">


    <div class="tagline">
      SUONO. FUTURO. QLTURA.
    </div>

    <div class="divider"></div>

    <div class="social">
      <!-- Sostituisci i link -->
      <a href="https://instagram.com/solo.qultura" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com/@soloqultura" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>

    <div class="email">
      <a href="mailto:soloqulturalab@gmail.com">soloqulturalab@gmail.com</a>
    </div>

  </div>

</body>
</html>
