<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>SOLOQULTURA — Studio creativo indipendente</title>
  <meta name="description" content="SOLOQULTURA è studio creativo indipendente. Produzione musicale, mix & master, visual e strategia per progetti culturali e release." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.soloqultura.com/" />
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SOLOQULTURA — Studio creativo" />
  <meta property="og:description" content="Produzione musicale, visual e strategia. Suono. Qultura. Futuro." />
  <meta property="og:url" content="https://www.soloqultura.com/" />
  <meta property="og:image" content="https://www.soloqultura.com/images/social-preview.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SOLOQULTURA — Studio creativo" />
  <meta name="twitter:description" content="Produzione musicale, visual e strategia." />
  <meta name="twitter:image" content="https://www.soloqultura.com/images/social-preview.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root{
      --bg:#000;
      --white:#ffffff;
      --line:rgba(255,255,255,0.25);
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,0.04), transparent 65%),
        radial-gradient(1400px 1000px at 50% 85%, rgba(0,0,0,0.85), #000 70%);
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      max-width:900px;
      opacity:0;
      transform:translateY(12px);
      animation: cinematicFade 1.4s cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes cinematicFade{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .main-logo{
      width:clamp(300px, 42vw, 720px);
      height:auto;
      filter:
        brightness(1.06)
        contrast(1.02)
        drop-shadow(0 0 44px rgba(255,255,255,0.06));
    }

    .tagline{
      font-size:clamp(13px, 1.3vw, 15px);
      letter-spacing:0.30em;
      text-transform:uppercase;
      font-weight:400;
    }

    /* Micro definizione studio */
    .micro{
      margin-top:4px;
      font-size:12px;
      letter-spacing:0.12em;
      text-transform:uppercase;
      opacity:0.78;
    }

    .divider{
      width:140px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--line), transparent);
      margin:8px 0 10px;
    }

    .mini-nav{
      display:flex;
      gap:32px;
      margin-top:6px;
      justify-content:center;
    }

    .mini-nav a{
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.28em;
      font-size:12px;
      font-weight:400;
      position:relative;
      padding:6px 2px;
      opacity:0.95;
      transition:all .25s ease;
      text-shadow:0 0 8px rgba(255,255,255,0.25);
    }

    .mini-nav a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-3px;
      height:1px;
      background:#fff;
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .25s ease;
    }

    .mini-nav a:hover{
      opacity:1;
      transform:translateY(-2px);
      text-shadow:0 0 14px rgba(255,255,255,0.45);
    }

    .mini-nav a:hover::after{
      transform:scaleX(1);
    }

    .social{
      display:flex;
      gap:16px;
      margin-top:12px;
    }

    .social a{
      width:46px;
      height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.35);
      color:#ffffff;
      text-decoration:none;
      background:rgba(255,255,255,0.05);
      transition:all .2s ease;
    }

    .social a:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.08);
      border-color:#fff;
    }

    .email{
      font-size:13px;
      margin-top:6px;
    }

    .email a{
      color:#ffffff;
      text-decoration:underline;
    }

    /* SEO footer discreto */
    .seo-footer{
      margin-top:18px;
      max-width:720px;
      font-size:11px;
      line-height:1.5;
      letter-spacing:0.04em;
      opacity:0.45;
    }

    .seo-footer strong{
      font-weight:500;
    }
  </style>

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"SOLOQULTURA",
    "url":"https://www.soloqultura.com/",
    "email":"soloqulturalab@gmail.com",
    "sameAs":[
      "https://instagram.com/solo.qultura",
      "https://youtube.com/@soloqultura"
    ],
    "logo":"https://www.soloqultura.com/images/new-logo.png"
  }
  </script>
</head>

<body>
  <main class="container">
    <div class="wrap">

      <img src="images/new-logo.png" alt="SOLOQULTURA" class="main-logo">

      <div class="tagline">SUONO. QULTURA. FUTURO.</div>

      <div class="micro">Produzione sonora · Visual · Strategia</div>

      <div class="divider"></div>

      <nav class="mini-nav">
        <a href="/studio/">STUDIO</a>
        <a href="/contatti/">CONTATTI</a>
      </nav>

      <div class="social">
        <a href="https://instagram.com/solo.qultura" target="_blank" rel="noopener">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://youtube.com/@soloqultura" target="_blank" rel="noopener">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://open.spotify.com" target="_blank" rel="noopener">
          <i class="fab fa-spotify"></i>
        </a>
      </div>

      <div class="email">
        <a href="mailto:soloqulturalab@gmail.com">soloqulturalab@gmail.com</a>
      </div>

      <div class="seo-footer">
        <strong>SOLOQULTURA</strong> è studio creativo indipendente.
        Produzione musicale, mix &amp; master, visual e strategia per progetti culturali e release.
      </div>

    </div>
  </main>
</body>
</html>
