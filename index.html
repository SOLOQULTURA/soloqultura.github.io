<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO TITLE OTTIMIZZATO -->
  <title>SOLOQULTURA — Studio creativo indipendente</title>

  <!-- SEO DESCRIPTION OTTIMIZZATA -->
  <meta name="description" content="SOLOQULTURA è studio creativo e progetto culturale indipendente. Produzione sonora, identità, strategia e progetti culturali." />

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root{
      --bg:#000;
      --white:#ffffff;
      --line:rgba(255,255,255,0.25);
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,0.04), transparent 65%),
        radial-gradient(1400px 1000px at 50% 85%, rgba(0,0,0,0.85), #000 70%);
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      max-width:900px;
      opacity:0;
      transform:translateY(12px);
      animation: cinematicFade 1.4s cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes cinematicFade{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .main-logo{
      width:clamp(300px, 42vw, 720px);
      height:auto;
      filter:
        brightness(1.06)
        contrast(1.02)
        drop-shadow(0 0 44px rgba(255,255,255,0.06));
    }

    .tagline{
      font-size:clamp(13px, 1.3vw, 15px);
      letter-spacing:0.30em;
      text-transform:uppercase;
      font-weight:400;
    }

    /* MICRO TESTO SEO (elegante, non invasivo) */
    .brand-text{
      font-size:13px;
      opacity:0.65;
      max-width:520px;
      line-height:1.6;
    }

    .divider{
      width:140px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--line), transparent);
      margin:6px 0 10px;
    }

    .mini-nav{
      display:flex;
      gap:32px;
      margin-top:8px;
      justify-content:center;
    }

    .mini-nav a{
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.28em;
      font-size:12px;
      font-weight:400;
      position:relative;
      padding:6px 2px;
      opacity:0.95;
      transition:all .25s ease;
      text-shadow:0 0 8px rgba(255,255,255,0.25);
    }

    .mini-nav a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-3px;
      height:1px;
      background:#fff;
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .25s ease;
    }

    .mini-nav a:hover{
      opacity:1;
      transform:translateY(-2px);
      text-shadow:0 0 14px rgba(255,255,255,0.45);
    }

    .mini-nav a:hover::after{
      transform:scaleX(1);
    }

    .social{
      display:flex;
      gap:16px;
      margin-top:12px;
    }

    .social a{
      width:46px;
      height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.35);
      color:#ffffff;
      text-decoration:none;
      background:rgba(255,255,255,0.05);
      transition:all .2s ease;
    }

    .social a:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.08);
      border-color:#fff;
    }

    .email{
      font-size:13px;
      margin-top:6px;
    }

    .email a{
      color:#ffffff;
      text-decoration:underline;
    }

  </style>
</head>

<body>
  <main class="container">
    <div class="wrap">

      <img src="/images/new-logo.png" alt="SOLOQULTURA" class="main-logo">

      <div class="tagline">SUONO. QULTURA. FUTURO.</div>

      <!-- TESTO BRAND PER GOOGLE -->
      <p class="brand-text">
        SOLOQULTURA è uno studio creativo indipendente che lavora su suono,
        identità e progetti culturali.
      </p>

      <div class="divider"></div>

      <nav class="mini-nav">
        <a href="/studio/">STUDIO</a>
        <a href="/contatti/">CONTATTI</a>
      </nav>

      <div class="social">
        <a href="https://instagram.com/solo.qultura" target="_blank">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://youtube.com/@soloqultura" target="_blank">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://open.spotify.com" target="_blank">
          <i class="fab fa-spotify"></i>
        </a>
      </div>

      <div class="email">
        <a href="mailto:soloqulturalab@gmail.com">soloqulturalab@gmail.com</a>
      </div>

    </div>
  </main>
</body>
</html>
