<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLOQULTURA</title>

  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta name="description" content="SOLOQULTURA — Suono. Qultura. Futuro." />
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph -->
  <meta property="og:title" content="SOLOQULTURA">
  <meta property="og:description" content="SUONO. QULTURA. FUTURO.">
  <meta property="og:image" content="https://www.soloqultura.com/images/social-preview.png">
  <meta property="og:url" content="https://www.soloqultura.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Verification -->
  <meta name="google-site-verification" content="qh_Bh2l8vh5yyb0r0-qEk8X5JzGL40YWVfH4GUEg8Gs" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root{
      --bg:#000;
      --white:#ffffff;
      --line:rgba(255,255,255,0.25);
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,0.04), transparent 65%),
        radial-gradient(1400px 1000px at 50% 85%, rgba(0,0,0,0.85), #000 70%);
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      max-width:900px;
      opacity:0;
      transform:translateY(12px);
      animation: cinematicFade 1.4s cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes cinematicFade{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .main-logo{
      width:clamp(300px, 42vw, 720px);
      height:auto;
      filter:
        brightness(1.06)
        contrast(1.02)
        drop-shadow(0 0 44px rgba(255,255,255,0.06))
        drop-shadow(0 0 140px rgba(255,255,255,0.03));
      animation: breatheSoft 9s ease-in-out infinite;
    }

    @keyframes breatheSoft{
      0%{ opacity:0.96; }
      50%{ opacity:1; }
      100%{ opacity:0.96; }
    }

    @media (max-width:768px){
      .main-logo{
        animation:none;
        opacity:1;
      }
    }

    .tagline{
      font-size:clamp(13px, 1.3vw, 15px);
      letter-spacing:0.30em;
      text-transform:uppercase;
      font-weight:400;
      color:#ffffff;
    }

    .divider{
      width:140px;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--line), transparent);
      margin:6px 0 10px;
    }

    .social{
      display:flex;
      gap:16px;
      margin-top:4px;
    }

    .social a{
      width:46px;
      height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.35);
      color:#ffffff;
      text-decoration:none;
      background:rgba(255,255,255,0.05);
      cursor:pointer;
    }

    .social a i{
      font-size:18px;
    }

    .email{
      font-size:13px;
      margin-top:6px;
    }

    .email a{
      color:#ffffff;
      text-decoration:underline;
      cursor:pointer;
    }

    @media (prefers-reduced-motion: reduce){
      .wrap{
        animation:none;
        opacity:1;
        transform:none;
      }
      .main-logo{
        animation:none;
      }
    }

  </style>
</head>

<body>
  <main class="container">
    <div class="wrap">

      <div class="logo-wrap">
        <img src="images/new-logo.png" alt="SOLOQULTURA" class="main-logo">
      </div>

      <div class="tagline">SUONO. QULTURA. FUTURO.</div>

      <div class="divider"></div>

      <div class="social">
        <a href="https://instagram.com/solo.qultura" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://youtube.com/@soloqultura" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://open.spotify.com/intl-it/artist/0lZbzkTC3h5CpS736vUP4f" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-spotify"></i>
        </a>
      </div>

      <div class="email">
        <a href="mailto:soloqulturalab@gmail.com">soloqulturalab@gmail.com</a>
      </div>

    </div>
  </main>
</body>
</html>
